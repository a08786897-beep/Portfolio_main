<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Admin Dashboard | Anshul Arora</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="section">
    <div class="container admin-container">
      <div class="admin-header">
        <div>
          <p class="eyebrow">Portfolio administration</p>
          <h1 class="section-title">Admin dashboard</h1>
        </div>
        <a class="btn btn-ghost" href="/">View portfolio</a>
      </div>

      <section class="glass-card admin-login" id="adminLogin">
        <h2 class="card-title">Sign in</h2>
        <p class="muted">Use the administrator account configured on the server.</p>
        <form class="form" id="loginForm">
          <div class="form-status" id="loginStatus" role="status" aria-live="polite"></div>
          <label class="form-row">
            <span class="label">Email</span>
            <input class="input" name="email" type="email" autocomplete="username" required maxlength="254" />
          </label>
          <label class="form-row">
            <span class="label">Password</span>
            <input class="input" name="password" type="password" autocomplete="current-password" required maxlength="200" />
          </label>
          <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
      </section>

      <section class="admin-dashboard" id="adminDashboard" hidden>
        <div class="admin-toolbar">
          <p class="muted" id="adminIdentity"></p>
          <button class="btn btn-ghost" id="logoutButton" type="button">Log out</button>
        </div>
        <div class="admin-tabs" role="tablist" aria-label="Admin sections">
          <button class="btn btn-soft admin-tab active" type="button" role="tab" aria-selected="true" data-tab="messages">Messages</button>
          <button class="btn btn-soft admin-tab" type="button" role="tab" aria-selected="false" data-tab="feedback">Feedback</button>
          <button class="btn btn-soft admin-tab" type="button" role="tab" aria-selected="false" data-tab="projects">Projects</button>
          <button class="btn btn-soft admin-tab" type="button" role="tab" aria-selected="false" data-tab="skills">Skills</button>
          <button class="btn btn-soft admin-tab" type="button" role="tab" aria-selected="false" data-tab="experience">Experience</button>
          <button class="btn btn-soft admin-tab" type="button" role="tab" aria-selected="false" data-tab="education">Education</button>
          <button class="btn btn-soft admin-tab" type="button" role="tab" aria-selected="false" data-tab="services">Services</button>
          <button class="btn btn-soft admin-tab" type="button" role="tab" aria-selected="false" data-tab="profile">Profile</button>
        </div>

        <section class="admin-panel active" id="panel-messages" role="tabpanel">
          <h2 class="section-title">Contact messages</h2>
          <div class="admin-records" id="messagesList" aria-live="polite"></div>
        </section>
        <section class="admin-panel" id="panel-feedback" role="tabpanel" hidden>
          <h2 class="section-title">Visitor feedback</h2>
          <div class="admin-records" id="feedbackList" aria-live="polite"></div>
        </section>

        <section class="admin-panel" id="panel-projects" role="tabpanel" hidden>
          <h2 class="section-title">Projects</h2>
          <div class="admin-manager" data-resource="projects"></div>
        </section>
        <section class="admin-panel" id="panel-skills" role="tabpanel" hidden>
          <h2 class="section-title">Skills</h2>
          <div class="admin-manager" data-resource="skills"></div>
        </section>
        <section class="admin-panel" id="panel-experience" role="tabpanel" hidden>
          <h2 class="section-title">Experience</h2>
          <div class="admin-manager" data-resource="experience"></div>
        </section>
        <section class="admin-panel" id="panel-education" role="tabpanel" hidden>
          <h2 class="section-title">Education</h2>
          <div class="admin-manager" data-resource="education"></div>
        </section>
        <section class="admin-panel" id="panel-services" role="tabpanel" hidden>
          <h2 class="section-title">Services</h2>
          <div class="admin-manager" data-resource="services"></div>
        </section>
        <section class="admin-panel" id="panel-profile" role="tabpanel" hidden>
          <h2 class="section-title">Portfolio profile</h2>
          <div class="glass-card admin-form-card">
            <form class="form" id="profileForm">
              <div class="form-status" id="profileStatus" role="status" aria-live="polite"></div>
              <div class="admin-fields" id="profileFields"></div>
              <button class="btn btn-primary" type="submit">Save profile</button>
            </form>
          </div>
        </section>
      </section>
    </div>
  </main>
  <script src="js/api.js" defer></script>
  <script src="js/admin.js" defer></script>
</body>
</html>
